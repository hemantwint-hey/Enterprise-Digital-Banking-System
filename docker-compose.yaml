services:
  # =========================================================================
  # Redis Cache & Session Store
  # Port: 6379 -> Matches spring.data.redis.port=6379
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: banking-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # =========================================================================
  # Apache Kafka (KRaft mode - Single Broker, No Zookeeper Required)
  # Port: 9092 -> Matches spring.kafka.bootstrap-servers=localhost:9092
  # =========================================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: banking-kafka
    hostname: kafka
    ports:
      # Exposed for Spring Boot running on host machine (localhost:9092)
      - "9092:9092"
    environment:
      # KRaft Settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners:
      # - PLAINTEXT: for host machine access (localhost:9092)
      # - DOCKER: for intra-container networking (kafka:29092)
      # - CONTROLLER: for KRaft internal cluster coordination
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # Topic & Partition defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # =========================================================================
  # Kafka UI (Web Console for monitoring topics, events & consumer groups)
  # Accessible in browser at: http://localhost:8085
  # =========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: banking-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-banking-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # MySQL Database (Optional Profile: 'db' or 'full')
  # Only starts if explicitly invoked: docker compose --profile db up -d
  # (Prevents port conflict if you already have local MySQL on 3306)
  # =========================================================================
  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    profiles: ["db", "full"]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: banking_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
    name: banking_redis_data
  kafka_data:
    name: banking_kafka_data
  mysql_data:
    name: banking_mysql_data
