services:
  # =========================================================================
  # 1. MySQL 8.0 (Relational Database & Transactional Ledger)
  # Port: 3306 -> Matches spring.datasource.url=jdbc:mysql://mysql:3306/banking_db
  # =========================================================================
  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-hemant851311420}
      MYSQL_DATABASE: banking_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - banking-network

  # =========================================================================
  # 2. Redis 7 (In-Memory Cache & Distributed Session Store)
  # Port: 6379 -> Matches spring.data.redis.port=6379
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: banking-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - banking-network

  # =========================================================================
  # 3. Apache Kafka (KRaft mode - Single Broker, No Zookeeper Required)
  # Port: 9092 (Host) / 29092 (Internal Docker Network)
  # =========================================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: banking-kafka
    hostname: kafka
    ports:
      # Exposed for external tools or host machine access (localhost:9092)
      - "9092:9092"
    environment:
      # KRaft Settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners:
      # - PLAINTEXT: for host machine access (localhost:9092)
      # - DOCKER: for intra-container networking (kafka:29092)
      # - CONTROLLER: for KRaft internal cluster coordination
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # Topic & Partition defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - banking-network

  # =========================================================================
  # 4. Kafka UI (Web Management Console for Topics & Consumer Groups)
  # Accessible in browser at: http://localhost:8085
  # =========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: banking-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-banking-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - banking-network

  # =========================================================================
  # 5. Zipkin (Distributed Tracing UI & Span Collector - Day 66)
  # Accessible in browser at: http://localhost:9411
  # =========================================================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: banking-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
    networks:
      - banking-network

  # =========================================================================
  # 6. Prometheus (Metrics Collector & Time-Series DB - Days 64 & 65)
  # Accessible in browser at: http://localhost:9090
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: banking-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - banking-network

  # =========================================================================
  # 7. Grafana (Metrics Visualization & Operational Dashboards - Day 65)
  # Accessible in browser at: http://localhost:3000 (admin / admin)
  # =========================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: banking-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - banking-network

  # =========================================================================
  # 8. Enterprise Digital Banking Core Service (Day 67)
  # Multi-stage containerized Spring Boot 4 / Java 21 Banking Backend
  # Accessible in browser at: http://localhost:8080
  # =========================================================================
  banking-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking-app
    ports:
      - "8080:8080"
    environment:
      # Active Spring Profile (Day 68)
      SPRING_PROFILES_ACTIVE: prod

      # Database connection (Resolves to 'mysql' container on Docker network)
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://${DB_HOST:-mysql}:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-hemant851311420}

      # JWT Secret (Externalized for Production Security)
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

      # Redis Cache & Session Store
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # Kafka Event Streaming (Internal Docker Network Port 29092)
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # Distributed Tracing with Zipkin
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

      # Java 21 Container Flags & Virtual Threads
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - banking-network

# =========================================================================
# Shared Bridge Network for Inter-Container Communication
# =========================================================================
networks:
  banking-network:
    name: banking-network
    driver: bridge

# =========================================================================
# Named Persistent Storage Volumes
# =========================================================================
volumes:
  mysql_data:
    name: banking_mysql_data
  redis_data:
    name: banking_redis_data
  kafka_data:
    name: banking_kafka_data
  prometheus_data:
    name: banking_prometheus_data
  grafana_data:
    name: banking_grafana_data
