spring.application.name=Enterprise-Digital-Banking-System

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:3306/banking_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:hemant851311420}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host = ${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port = ${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type = redis
spring.cache.redis.time-to-live = 600000

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.group-id=banking-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer Idempotence (Day 59)
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Consumer Manual Offset / Ack Mode (Day 59)
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=RECORD

# Actuator Endpoints & Production Health (Days 60 & 63)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Actuator App Info
management.info.env.enabled=true
info.app.name=Enterprise Digital Banking System
info.app.description=Enterprise Core Banking & Kafka Event Platform
info.app.version=1.0.0

# Auto-register Kafka Producer and Consumer metrics with Micrometer (Day 60)
spring.kafka.consumer.properties.micrometer.core.kafka.enabled=true
spring.kafka.producer.properties.micrometer.core.kafka.enabled=true

# =========================================================================
# Distributed Tracing with OpenTelemetry & Zipkin (Day 66)
# =========================================================================
# Sample 100% of requests in development (1.0 = 100%)
management.tracing.sampling.probability=1.0

# Zipkin Collector Endpoint
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

# Propagate W3C Trace Context automatically across Kafka message headers
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# =========================================================================
# High-Throughput Concurrency & Virtual Threads (Java 21 Project Loom)
# =========================================================================
spring.threads.virtual.enabled=true
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
