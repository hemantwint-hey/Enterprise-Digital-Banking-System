# =============================================================================
# Enterprise Digital Banking System - Base Configuration (All Profiles)
# =============================================================================
spring.application.name=Enterprise-Digital-Banking-System

# Default Active Profile (Safe Local Fallback)
spring.profiles.active=dev

# High-Throughput Concurrency & Project Loom Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Cache Abstraction Defaults
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# =============================================================================
# Spring Data Web Pagination Safeguards (Day 77)
# =============================================================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size

# =============================================================================
# Security Hardening: Rate Limiting & CORS Defaults (Day 81)
# =============================================================================
banking.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
banking.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# =============================================================================
# Flyway Database Migration Configuration
# =============================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# =============================================================================
# Apache Kafka Common Broker Configuration
# =============================================================================
spring.kafka.consumer.group-id=banking-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=RECORD

# Kafka Serializers & Deserializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer Idempotence (Day 59)
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Kafka Distributed Tracing Observation (Day 66)
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# Micrometer Metrics Auto-Registration
spring.kafka.consumer.properties.micrometer.core.kafka.enabled=true
spring.kafka.producer.properties.micrometer.core.kafka.enabled=true

# =============================================================================
# Application Metadata (Actuator /info)
# =============================================================================
management.info.env.enabled=true
info.app.name=Enterprise Digital Banking System
info.app.description=Enterprise Core Banking & Kafka Event Platform
info.app.version=1.0.0
