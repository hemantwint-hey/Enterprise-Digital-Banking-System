
# =============================================================================
# Enterprise Digital Banking System - Development Profile (dev)
# Optimized for: Localhost Debugging, Verbose SQL Tracing & Fast Iteration
# =============================================================================

# Database Configuration (Local MySQL with Safe Fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:hemant851311420}

# Hibernate DDL & Verbose SQL Logging for Local Query Optimization
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool (Dev Sizing)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=BankingHikariCP-Dev

# Redis Cache (Local Instance)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Kafka Broker (Local Instance)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Security & JWT Token (Local Development Key & Extended 24h Expiration)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator Endpoints (Expose All Common Diagnostic Endpoints for Debugging)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Distributed Tracing (100% Trace Sampling in Dev)
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

# Logging Levels (Verbose Development Diagnostics)
logging.level.org.example.enterprisedigitalbankingsystem=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.web=INFO
logging.level.org.apache.kafka=INFO

