# =============================================================================
# Enterprise Digital Banking System - Production Profile (prod)
# Optimized for: High Throughput, Hardened Security & Container Orchestration
# =============================================================================

# Database Configuration (Externalized to Environment Variables, No Insecure Defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:banking_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate DDL & Logging (Strict Schema Validation, SQL Logging Disabled for Performance)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# HikariCP Production High-Throughput Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.pool-name=BankingHikariCP-Prod

# Redis Cache (Containerized Redis Service with Connection Timeout)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Kafka Broker (Internal Container Cluster with Batching Optimization)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.properties.batch.size=32768
spring.kafka.consumer.properties.session.timeout.ms=45000
spring.kafka.consumer.properties.max.poll.interval.ms=300000

# Security & JWT Token (Strict External Secret & 1-Hour Session Expiry)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Actuator Endpoints (Minimal Exposure for Prometheus Scraping & K8s Probes)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Distributed Tracing (Adaptive 10% Sampling to Avoid Tracing Bottlenecks)
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}

# Reverse Proxy / AWS ALB Forwarded Headers Handling (Day 81)
server.forward-headers-strategy=native

# Logging Levels (Production-Grade High Performance Logging)
logging.level.root=WARN
logging.level.org.example.enterprisedigitalbankingsystem=INFO
logging.level.org.hibernate=WARN
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.web=WARN

